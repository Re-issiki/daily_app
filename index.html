<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムクエスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 id="title">今日のクエスト</h1>

<div class="category">
  <h2>勉強系</h2>
  <ul id="studyQuest"></ul>
  <button onclick="randomQuests('study')">開始</button>
  <button class="reset" onclick="resetQuests('study')">リセット</button>
</div>

<div class="category">
  <h2>生活系</h2>
  <ul id="lifeQuest"></ul>
  <button onclick="randomQuests('life')">開始</button>
  <button class="reset" onclick="resetQuests('life')">リセット</button>
</div>

<button id="editBtn" onclick="toggleEditor()">クエスト管理</button>

<div id="editorPanel">
  <h2>クエスト管理</h2>
  
  <select id="categorySelect">
    <option value="study">勉強系</option>
    <option value="life">生活系</option>
  </select>

  <input type="text" id="newQuest" placeholder="追加するクエスト">
  <button onclick="addQuest()">追加</button>

  <h3>登録済みクエスト</h3>
  <ul id="questList"></ul>

  <button id="closeEditor" onclick="toggleEditor()">閉じる</button>
</div>

<script src="script.js"></script>
</body>
</html>
