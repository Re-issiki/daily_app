<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Status App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="home" class="screen">
  <h1>プロフィール</h1>

  <div class="card">
    <p>名前：Re</p>
    <p>所属：〇〇学校</p>
  </div>

  <h2>実績</h2>
  <div class="card">
    <p>1. 毎日勉強30分を30日継続</p>
    <p>2. 数学模試 偏差値+8</p>
    <p>3. 腕立て100回達成</p>
  </div>

  <h2>ステータス</h2>
  <div class="card">
    <button onclick="openStatus('body')">身体能力</button>
    <button onclick="openStatus('math')">数学</button>
  </div>
</div>

<div id="status" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1 id="statusTitle"></h1>
  <canvas id="radarChart"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
