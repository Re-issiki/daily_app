<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>クエストアプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- ホーム画面 -->
  <div id="homeScreen" class="screen">

    <header>
      <h1>クエスト一覧</h1>
      <button onclick="showManage()">管理</button>
      <button onclick="showStatus()">ステータス</button>
    </header>

    <div id="homeCategories" class="category-container"></div>

  </div>


  <!-- 管理画面 -->
  <div id="manageScreen" class="screen" style="display:none;">

    <header>
      <h1>カテゴリ管理</h1>
      <button onclick="backHome()">戻る</button>
    </header>

    <div id="categoryAddArea">
      <input type="text" id="newCategoryInput" placeholder="新しいカテゴリ名">
      <button onclick="addCategory()">追加</button>
    </div>

    <div id="manageCategories"></div>

  </div>


  <!-- ステータス画面 -->
  <div id="statusScreen" class="screen" style="display:none;">

    <header>
      <h1>ステータス</h1>
      <button onclick="backHomeFromStatus()">戻る</button>
    </header>

    <div id="statusArea">

      <label>プレイヤー名</label>
      <input type="text" id="playerNameInput">
      <button onclick="saveStatus()">保存</button>

      <h2>カテゴリ別 ランク・EXP</h2>
      <div id="categoryStatus"></div>

      <h2>ステータスチャート</h2>
      <canvas id="statusRadar" width="300" height="300"></canvas>

      <button onclick="resetAllStatus()">全ステータスリセット</button>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
