<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Status App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- ホーム -->
<div id="home" class="screen">
  <h1>プロフィール</h1>

  <div class="card">
    <p id="viewName"></p>
    <p id="viewSchool"></p>
  </div>

  <h2>実績</h2>
  <div class="card">
    <p id="ach1"></p>
    <p id="ach2"></p>
    <p id="ach3"></p>
  </div>
  <button onclick="openAchievementList()">実績一覧を見る</button>

  <h2>ステータス</h2>
  <div class="card" id="statusButtons"></div>

  <button class="edit" onclick="openEdit()">＋ データ入力</button>
  <button onclick="openPomodoro()">✎勉強をする</button>
</div>

<!-- ステータス詳細 -->
<div id="status" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1 id="statusTitle"></h1>

  <div class="card">
    <canvas id="radarChart"></canvas>
  </div>

  <div class="card">
    <h2>項目管理</h2>
    <div id="itemList"></div>
    <input id="newItemName" placeholder="項目名">
    <button onclick="addItem()">追加</button>
  </div>

  <div class="card">
    <h2>勉強時間を追加</h2>
    <select id="itemSelect"></select>
    <div class="time-row">
      <select id="hourSelect"></select> 時間
      <select id="minuteSelect"></select> 分
    </div>
    <button onclick="addStudy()">追加</button>
  </div>
</div>

<!-- 編集画面 -->
<div id="edit" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1>データ入力</h1>

  <div class="card">
    <label>名前</label>
    <input id="inputName">

    <label>所属</label>
    <input id="inputSchool">
  </div>

  <h2>ステータス管理</h2>
  <div class="card" id="statusManage"></div>

  <div class="card">
    <input id="newStatusName" placeholder="例：英語">
    <button onclick="addStatus()">追加</button>
  </div>

  <button onclick="saveData()">保存</button>

  <label>背景画像</label>
  <input type="file" accept="image/*" onchange="setBackgroundImage(event)">
  <button onclick="clearBackground()">背景をリセット</button>
  <label>カード透明度</label>
  <input
  id="cardOpacitySlider"
  type="range"
  min="0.05"
  max="1"
  step="0.05"
  value="0.75"
  oninput="setCardOpacity(this.value)"
  >


</div>

<!-- 実績一覧 -->
<div id="achievementList" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1>実績一覧</h1>

  <div class="card" id="achievementCards"></div>

  <div class="card">
    <h2>実績を追加</h2>

    <label>実績内容</label>
    <input id="newAchText" placeholder="実績内容">

    <label>ランク</label>
    <select id="newAchRank">
      <option value="c">C</option>
      <option value="b">B</option>
      <option value="a">A</option>
      <option value="s">S</option>
      <option value="ss">SS</option>
    </select>

    <button onclick="addAchievement()">実績を追加</button>
  </div>
</div>

<div id="pomodoro" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1>ポモドーロタイマー</h1>
  <label>時間（分）:</label>
  <input type="number" id="pomodoroMinutes" value="25" min="1" max="180">
  <canvas id="pomodoroCanvas" width="200" height="200"></canvas>
  <div style="text-align:center; margin-top:10px;">
    <button onclick="startPomodoro()">スタート</button>
    <button onclick="pausePomodoro()">一時停止</button>
    <button onclick="resetPomodoro()">リセット</button>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
