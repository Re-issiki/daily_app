<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Status App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- ホーム -->
<div id="home" class="screen">
  <h1>プロフィール</h1>
  <div class="card">
    <p id="viewName"></p>
    <p id="viewSchool"></p>
  </div>

  <h2>実績</h2>
  <div class="card">
    <p id="ach1"></p>
    <p id="ach2"></p>
    <p id="ach3"></p>
  </div>

  <h2>ステータス</h2>
  <div class="card" id="statusButtons"></div>

  <button class="edit" onclick="openEdit()">＋ データ入力</button>
</div>

<!-- ステータス詳細 -->
<div id="status" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1 id="statusTitle"></h1>

  <canvas id="radarChart"></canvas>

  <div class="card">
    <h2>項目追加</h2>
    <input id="newItemName" placeholder="項目名">
    <button onclick="addItem()">追加</button>
  </div>

  <div class="card">
    <h2>勉強時間を追加</h2>
    <select id="itemSelect"></select>
    <select id="hourSelect"></select> 時間
    <select id="minuteSelect"></select> 分
    <button onclick="addStudy()">追加</button>
  </div>
</div>

<!-- 編集画面 -->
<div id="edit" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1>データ入力</h1>

  <div class="card">
    <label>名前</label>
    <input id="inputName">
    <label>所属</label>
    <input id="inputSchool">
    <label>実績1</label><input id="inputAch1">
    <label>実績2</label><input id="inputAch2">
    <label>実績3</label><input id="inputAch3">
  </div>

  <h2>ステータス追加</h2>
  <div class="card">
    <input id="newStatusName" placeholder="例：英語">
    <button onclick="addStatus()">追加</button>
  </div>

  <button onclick="saveData()">保存</button>
</div>

<script src="script.js"></script>
</body>
</html>
