<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Roadmap App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <button id="backBtn" class="btn hidden">← Back</button>
  <h1 id="headerTitle">Roadmap App</h1>
  <button id="newBtn" class="btn">＋ New</button>
</header>

<!-- HOME -->
<main id="homeView">
  <ul id="roadmapList" class="list"></ul>
</main>

<!-- CREATE -->
<main id="createView" class="hidden">
  <input id="titleInput" placeholder="タイトル">
  <input id="goalInput" placeholder="最終目標">
  <textarea id="stepsInput" placeholder="例：
基礎
- HTML
- CSS
応用
- JavaScript"></textarea>
  <button id="saveBtn" class="btn">保存</button>
</main>

<!-- VIEW -->
<main id="viewView" class="hidden">
  <div id="tree" class="tree"></div>
</main>

<script src="script.js"></script>
</body>
</html>
