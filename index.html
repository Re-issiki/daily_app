<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Status App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- ホーム画面 -->
<div id="home" class="screen">
  <h1>プロフィール</h1>

  <div class="card">
    <p id="viewName"></p>
    <p id="viewSchool"></p>
  </div>

  <h2>実績</h2>
  <div class="card">
    <p id="ach1"></p>
    <p id="ach2"></p>
    <p id="ach3"></p>
  </div>

  <h2>ステータス</h2>
  <div class="card">
    <button onclick="openStatus('body')">身体能力</button>
    <button onclick="openStatus('math')">数学</button>
  </div>

  <button class="edit" onclick="openEdit()">＋ データ入力</button>
</div>

<!-- ステータス詳細 -->
<div id="status" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1 id="statusTitle"></h1>

  <canvas id="radarChart"></canvas>

  <div class="card">
    <h2>勉強時間を追加</h2>
    <select id="itemSelect"></select>
    <input type="number" id="addHours" placeholder="時間">
    <button onclick="addStudy()">追加</button>
  </div>
</div>

<!-- 編集画面 -->
<div id="edit" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1>データ入力</h1>

  <div class="card">
    <label>名前</label>
    <input id="inputName">

    <label>所属</label>
    <input id="inputSchool">

    <label>実績1</label>
    <input id="inputAch1">
    <label>実績2</label>
    <input id="inputAch2">
    <label>実績3</label>
    <input id="inputAch3">
  </div>

  <h2>数学ステータス項目</h2>
  <div class="card" id="editItems"></div>
  <button onclick="addItem()">＋ 項目追加</button>

  <button onclick="saveData()">保存</button>
</div>

<script src="script.js"></script>
</body>
</html>
