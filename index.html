<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムクエスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== ホーム画面 ===== -->
<div id="homeScreen">
  <h1 id="title">今日のクエスト</h1>

  <div class="category">
    <h2>勉強系</h2>
    <ul id="studyQuest"></ul>
    <button onclick="randomQuests('study')">ランダム生成</button>
  </div>

  <div class="category">
    <h2>生活系</h2>
    <ul id="lifeQuest"></ul>
    <button onclick="randomQuests('life')">ランダム生成</button>
  </div>

  <button id="manageBtn" onclick="showManage()">⚙ クエスト管理</button>
</div>


<!-- ===== 管理画面 ===== -->
<div id="manageScreen" style="display:none;">
  <h1>クエスト管理</h1>

  <h2>勉強系</h2>
  <ul id="manageStudy"></ul>
  <input type="text" id="studyInput" placeholder="追加クエスト…">
  <button onclick="addQuest('study')">追加</button>

  <h2>生活系</h2>
  <ul id="manageLife"></ul>
  <input type="text" id="lifeInput" placeholder="追加クエスト…">
  <button onclick="addQuest('life')">追加</button>

  <button id="backBtn" onclick="backHome()">← 戻る</button>
</div>

<script src="script.js"></script>
</body>
</html>
