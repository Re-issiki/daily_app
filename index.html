<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Status App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- ホーム -->
<div id="home" class="screen">
  <h1>プロフィール</h1>

  <div class="card">
    <p id="viewName"></p>
    <p id="viewSchool"></p>
  </div>

  <h2>実績</h2>
  <div class="card">
    <p id="ach1"></p>
    <p id="ach2"></p>
    <p id="ach3"></p>
  </div>
  <button onclick="openAchievementList()">実績一覧を見る</button>

  <h2>ステータス</h2>
  <div class="card" id="statusButtons"></div>

  <button class="edit" onclick="openEdit()">＋ データ入力</button>
  <button onclick="openPomodoro()">✎ 勉強する</button>
</div>

<!-- ステータス詳細 -->
<div id="status" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1 id="statusTitle"></h1>

  <div class="card">
    <canvas id="radarChart"></canvas>
  </div>

  <div class="card">
    <h2>項目管理</h2>
    <div id="itemList"></div>
    <input id="newItemName" placeholder="項目名">
    <button onclick="addItem()">追加</button>
  </div>

  <div class="card">
    <h2>勉強時間を追加</h2>
    <select id="itemSelect"></select>
    <div class="time-row">
      <select id="hourSelect"></select> 時間
      <select id="minuteSelect"></select> 分
    </div>
    <button onclick="addStudy()">追加</button>
  </div>
</div>

<!-- 編集画面 -->
<div id="edit" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1>データ入力</h1>

  <div class="card">
    <label>名前</label>
    <input id="inputName">

    <label>所属</label>
    <input id="inputSchool">
  </div>

  <h2>ステータス管理</h2>
  <div class="card" id="statusManage"></div>

  <div class="card">
    <input id="newStatusName" placeholder="例：英語">
    <button onclick="addStatus()">追加</button>
  </div>

  <button onclick="saveData()">保存</button>

  <label>背景画像</label>
  <input type="file" accept="image/*" onchange="setBackgroundImage(event)">
  <button onclick="clearBackground()">背景をリセット</button>
  <label>カード透明度</label>
  <input
  id="cardOpacitySlider"
  type="range"
  min="0.05"
  max="1"
  step="0.05"
  value="0.75"
  oninput="setCardOpacity(this.value)"
  >


</div>

<!-- 実績一覧 -->
<div id="achievementList" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1>実績一覧</h1>

  <div class="card" id="achievementCards"></div>

  <div class="card">
    <h2>実績を追加</h2>

    <label>実績内容</label>
    <input id="newAchText" placeholder="実績内容">

    <label>ランク</label>
    <select id="newAchRank">
      <option value="c">C</option>
      <option value="b">B</option>
      <option value="a">A</option>
      <option value="s">S</option>
      <option value="ss">SS</option>
    </select>

    <button onclick="addAchievement()">実績を追加</button>
  </div>
</div>

<div id="pomodoro" class="screen hidden">
  <button class="back" onclick="backHome()">← 戻る</button>
  <h1>ポモドーロ</h1>

  <div class="card">
    <label>対象項目</label>
    <select id="pomodoroSubject"></select>

    <label>作業時間</label>
    <select id="pomodoroWork">
      <option value="25">25分</option>
      <option value="30">30分</option>
      <option value="50">50分</option>
    </select>

    <label>休憩時間</label>
    <select id="pomodoroBreak">
      <option value="5">5分</option>
      <option value="10">10分</option>
    </select>

    <button onclick="startPomodoro()">開始</button>
  </div>

  <div class="card">
    <h2>タイマー</h2>
    <div id="pomodoroTimer" style="font-size:2rem; font-weight:700;">
      00:00
    </div>
    <button onclick="cancelPomodoro()">停止</button>
  </div>

  <div class="card">
    <div class="card">
      <h2>記録</h2>
      <canvas id="pomodoroChart"></canvas>
      <p id="todayPomodoro"></p>
      <p id="weekPomodoro"></p>
      <p id="lastWeekPomodoro" style="color:#555;"></p>
    </div>

  
  </div>
  <button onclick="openPomodoroHistory()">
    履歴一覧を見る
  </button>


</div>
<div id="pomodoroHistoryScreen" class="screen hidden">
  <button class="back" onclick="openPomodoro()">← 戻る</button>
  <h1>ポモドーロ履歴</h1>

  <div class="card">
    <div id="pomodoroHistoryList"></div>
  </div>
</div>


<div id="undoToast" style="
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  background:#111; color:white; padding:10px 14px; border-radius:12px;
  display:none;
">
  記録を追加しました
  <button onclick="undoPomodoro()" style="margin-left:8px;">取り消す</button>
</div>



<script src="script.js"></script>
</body>
</html>
